<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisitFlow - Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7ff;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 22px 18px;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      margin-top: 5px;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card .icon {
      font-size: 28px;
    }

    .card h3 {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }

    .value {
      font-size: 25px;
      font-weight: bold;
      margin-top: 5px;
      color: #667eea;
    }

    .section {
      margin-top: 25px;
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #667eea;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .logout {
      background: #ef4444;
    }

    #message {
      margin-top: 15px;
      color: #667eea;
      text-align: center;
    }

    @media (min-width: 700px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <h1>🌐 VisitFlow</h1>
    <p>Your website promotion dashboard</p>
  </div>
</header>

<div class="container">

  <div class="welcome">
    <h2>Welcome, <span id="username">User</span> 👋</h2>
    <p>Manage your visits, points and campaigns from here.</p>
  </div>

  <div class="stats">

    <div class="card">
      <div class="icon">⭐</div>
      <h3>Points</h3>
      <div class="value" id="points">0</div>
    </div>

    <div class="card">
      <div class="icon">💰</div>
      <h3>Wallet</h3>
      <div class="value">$<span id="balance">0.00</span></div>
    </div>

    <div class="card">
      <div class="icon">🔥</div>
      <h3>Streak</h3>
      <div class="value"><span id="streak">0</span> Days</div>
    </div>

    <div class="card">
      <div class="icon">👑</div>
      <h3>PRO Status</h3>
      <div class="value" id="pro">FREE</div>
    </div>

  </div>

  <div class="section">
    <h2>🚀 Quick Actions</h2>

    <div class="buttons">
      <button class="btn">🔗 My Links</button>
      <button class="btn">📢 Create Campaign</button>
      <button class="btn">🎁 Daily Bonus</button>
      <button class="btn">💵 Withdraw</button>
      <button class="btn">👑 Upgrade PRO</button>
      <button class="btn logout" onclick="logout()">🚪 Logout</button>
    </div>

    <div id="message"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://xofmeyvdnnyebfmabdfu.supabase.co';
  const SUPABASE_KEY = 'YOUR_PUBLISHABLE_KEY';

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }
</script>

</body>
</html>
